[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "freedomforgeai"
version = "0.1.0"
description = "Free, local, private AI assistant — runs 100% on your machine."
readme = "README.md"
license = { file = "LICENSE.md" }
requires-python = ">=3.10"
authors = [
    { name = "Ryan Dennison" }
]
keywords = ["AI", "LLM", "local", "private", "chat", "assistant"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Desktop Environment",
    "Intended Audience :: End Users/Desktop",
    "License :: Other/Proprietary License",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "customtkinter>=5.2.0",
    "llama-cpp-python>=0.2.0",
    "psutil>=5.9.0",
    "gputil>=1.4.0",
    "requests>=2.28.0",
    "SpeechRecognition>=3.10.0",
    "pyttsx3>=2.90",
    "cryptography>=41.0.0",
    "Pillow>=10.0.0",
    "qrcode[pil]>=7.4.2",
]

[project.optional-dependencies]
audio = ["pyaudio>=0.2.13"]
build = ["pyinstaller>=6.0.0"]
dev   = ["pytest>=7.0", "ruff>=0.4"]

[project.urls]
Repository = "https://github.com/freeechoaiwhisperer-hash/stupid-simpleAI"

[project.scripts]
freedomforgeai = "app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "ui*", "modules*", "assets*", "utils*"]

[tool.setuptools.package-data]
"assets" = ["themes/*.json", "icons/*", "i18n/*.json"]
"models" = [".gitkeep"]
